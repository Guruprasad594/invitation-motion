<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc">
  <title id="title">Yashas weds Nithina — wedding invitation</title>
  <desc id="desc">A traditional ivory and deep maroon wedding invitation for 15 November 2026 at R. N. Shetty Hall, Kundapura.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf5e9"/>
      <stop offset="0.52" stop-color="#f5ead7"/>
      <stop offset="1" stop-color="#efe0c8"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#d9b76e"/>
      <stop offset="0.5" stop-color="#aa7e36"/>
      <stop offset="1" stop-color="#e4ca86"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#e9d39b" stop-opacity=".28"/>
      <stop offset="1" stop-color="#e9d39b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grain" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="6" r="1" fill="#9c7d4c" opacity=".09"/>
      <circle cx="24" cy="21" r=".8" fill="#9c7d4c" opacity=".07"/>
      <path d="M9 29l2-1" stroke="#9c7d4c" stroke-width=".7" opacity=".06"/>
    </pattern>
    <g id="leaf" fill="none" stroke="#9d7534" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 0C-16-17-17-37 0-49C17-37 16-17 0 0Z" fill="#72834d" fill-opacity=".18"/>
      <path d="M0-2V-43M0-23l-9-10M0-18l9-10"/>
    </g>
    <g id="petal" fill="#7a2631" stroke="#bc9550" stroke-width="1.5">
      <path d="M0 0C-12-12-11-29 0-38C11-29 12-12 0 0Z"/>
    </g>
  </defs>

  <!-- Warm handmade-paper ground and fine grain -->
  <rect width="1080" height="1920" fill="url(#paper)"/>
  <rect width="1080" height="1920" fill="url(#grain)"/>
  <ellipse cx="540" cy="800" rx="450" ry="640" fill="url(#glow)"/>

  <!-- Double gold frame -->
  <rect x="37" y="37" width="1006" height="1846" rx="9" fill="none" stroke="url(#gold)" stroke-width="3"/>
  <rect x="53" y="53" width="974" height="1814" rx="6" fill="none" stroke="#aa7e36" stroke-width="1.2" opacity=".7"/>
  <rect x="75" y="75" width="930" height="1770" rx="4" fill="none" stroke="#aa7e36" stroke-width=".8" opacity=".45"/>

  <!-- Corner flourishes -->
  <g fill="none" stroke="#a7803e" stroke-width="2" opacity=".85">
    <path d="M78 212V104Q78 78 104 78H212M78 143Q112 143 143 112Q174 81 174 78"/>
    <path d="M1002 212V104Q1002 78 976 78H868M1002 143Q968 143 937 112Q906 81 906 78"/>
    <path d="M78 1708v108q0 26 26 26h108M78 1777q34 0 65 31t31 34"/>
    <path d="M1002 1708v108q0 26-26 26H868M1002 1777q-34 0-65 31t-31 34"/>
  </g>
  <g fill="#9d7534" opacity=".85">
    <circle cx="118" cy="118" r="4"/><circle cx="962" cy="118" r="4"/>
    <circle cx="118" cy="1802" r="4"/><circle cx="962" cy="1802" r="4"/>
  </g>

  <!-- Hanging mango-leaf toran -->
  <path d="M248 191Q540 302 832 191" fill="none" stroke="#a7803e" stroke-width="2"/>
  <g>
    <use href="#leaf" transform="translate(284 209) rotate(-33) scale(.72)"/>
    <use href="#leaf" transform="translate(332 225) rotate(-26) scale(.78)"/>
    <use href="#leaf" transform="translate(383 240) rotate(-19) scale(.82)"/>
    <use href="#leaf" transform="translate(434 251) rotate(-12) scale(.83)"/>
    <use href="#leaf" transform="translate(485 258) rotate(-6) scale(.82)"/>
    <use href="#leaf" transform="translate(540 261) scale(.82)"/>
    <use href="#leaf" transform="translate(595 258) rotate(6) scale(.82)"/>
    <use href="#leaf" transform="translate(646 251) rotate(12) scale(.83)"/>
    <use href="#leaf" transform="translate(697 240) rotate(19) scale(.82)"/>
    <use href="#leaf" transform="translate(748 225) rotate(26) scale(.78)"/>
    <use href="#leaf" transform="translate(796 209) rotate(33) scale(.72)"/>
  </g>

  <!-- Lotus medallion -->
  <g transform="translate(540 365)">
    <circle r="76" fill="#f7eedf" stroke="url(#gold)" stroke-width="2.5"/>
    <circle r="66" fill="none" stroke="#a7803e" stroke-width="1" stroke-dasharray="2 7"/>
    <g transform="translate(0 13)">
      <use href="#petal" transform="translate(0 0)"/>
      <use href="#petal" transform="rotate(45)"/>
      <use href="#petal" transform="rotate(90)"/>
      <use href="#petal" transform="rotate(135)"/>
      <use href="#petal" transform="rotate(180)"/>
      <use href="#petal" transform="rotate(225)"/>
      <use href="#petal" transform="rotate(270)"/>
      <use href="#petal" transform="rotate(315)"/>
      <circle r="15" fill="#d5b164" stroke="#7a2631" stroke-width="1.5"/>
      <circle r="4" fill="#7a2631" stroke="none"/>
    </g>
  </g>

  <!-- Invitation copy -->
  <text x="540" y="500" text-anchor="middle" fill="#8d6a34" font-family="Segoe UI, Arial, sans-serif" font-size="23" letter-spacing="7">WITH THE BLESSINGS OF OUR FAMILIES</text>
  <path d="M330 540H480M600 540H750" stroke="#b18b48" stroke-width="1.5"/>
  <path d="M540 532l8 8-8 8-8-8Z" fill="#a7803e"/>

  <text x="540" y="629" text-anchor="middle" fill="#7a2631" font-family="Segoe UI, Arial, sans-serif" font-size="25" letter-spacing="9">WEDDING INVITATION</text>
  <text x="540" y="691" text-anchor="middle" fill="#5b4737" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-style="italic">With joy in our hearts, we invite you to celebrate</text>

  <text x="540" y="846" text-anchor="middle" fill="#64202b" font-family="Georgia, 'Times New Roman', serif" font-size="100" letter-spacing="5">YASHAS</text>
  <g transform="translate(540 911)">
    <path d="M-135 0H-64M64 0H135" stroke="#ad8440" stroke-width="1.5"/>
    <path d="M0-11l11 11L0 11-11 0Z" fill="#ad8440"/>
    <text x="0" y="11" text-anchor="middle" fill="#8d6a34" font-family="Segoe UI, Arial, sans-serif" font-size="22" letter-spacing="5">WEDS</text>
  </g>
  <text x="540" y="1038" text-anchor="middle" fill="#64202b" font-family="Georgia, 'Times New Roman', serif" font-size="100" letter-spacing="4">NITHINA</text>

  <text x="540" y="1126" text-anchor="middle" fill="#5b4737" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-style="italic">as they begin their beautiful journey together</text>

  <!-- Date and time panel -->
  <path d="M248 1201H832M248 1451H832" stroke="#ad8440" stroke-width="1.5"/>
  <path d="M257 1192l9 9-9 9-9-9ZM823 1192l9 9-9 9-9-9ZM257 1442l9 9-9 9-9-9ZM823 1442l9 9-9 9-9-9Z" fill="#ad8440"/>
  <text x="540" y="1270" text-anchor="middle" fill="#8d6a34" font-family="Segoe UI, Arial, sans-serif" font-size="23" letter-spacing="8">SUNDAY</text>
  <text x="540" y="1341" text-anchor="middle" fill="#64202b" font-family="Georgia, 'Times New Roman', serif" font-size="47" letter-spacing="2">15 NOVEMBER 2026</text>
  <text x="540" y="1401" text-anchor="middle" fill="#5b4737" font-family="Segoe UI, Arial, sans-serif" font-size="25" letter-spacing="3">CEREMONY AT 11:51 AM</text>

  <!-- Venue -->
  <g transform="translate(540 1515)" fill="none" stroke="#9d7534" stroke-width="2">
    <path d="M-28 0Q0-25 28 0M-19 0V24M19 0V24M-29 24H29"/>
    <circle cx="0" cy="-5" r="3" fill="#9d7534"/>
  </g>
  <text x="540" y="1597" text-anchor="middle" fill="#64202b" font-family="Georgia, 'Times New Roman', serif" font-size="35" letter-spacing="1">R. N. SHETTY HALL</text>
  <text x="540" y="1650" text-anchor="middle" fill="#8d6a34" font-family="Segoe UI, Arial, sans-serif" font-size="24" letter-spacing="7">KUNDAPURA</text>

  <text x="540" y="1741" text-anchor="middle" fill="#5b4737" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-style="italic">Your presence and blessings will make our day complete.</text>
  <g transform="translate(540 1794)" fill="none" stroke="#a7803e" stroke-width="1.5">
    <path d="M-110 0H-24M24 0h86"/>
    <path d="M0 0C-17-12-17-25 0-31C17-25 17-12 0 0ZM0 0C-17 12-17 25 0 31C17 25 17 12 0 0ZM0 0C-12-17-25-17-31 0C-25 17-12 17 0 0ZM0 0C12-17 25-17 31 0C25 17 12 17 0 0Z" fill="#7a2631" fill-opacity=".16"/>
    <circle r="4" fill="#a7803e"/>
  </g>
</svg>
